name: Native build and public-tree checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11 binutils dpkg-dev python3 gdb
      - name: Check the public tree
        run: python3 tools/check_public_tree.py
      - name: Scan for secrets with checksum-pinned Gitleaks
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
      - name: Bootstrap, build and run native CTest
        run: ./setup.sh --jobs 2 --replay-tools
      - name: Run tool and source regressions
        run: python3 tools/test.py
